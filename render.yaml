services:
  - type: web
    name: hh-intake
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-prod.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hh-intake-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # OSINT data-source credentials (optional — search works without them;
      # each one activates / strengthens its source). Set in the Render
      # dashboard; sync:false keeps them out of the repo.
      - key: GITHUB_TOKEN
        sync: false
      - key: COURTLISTENER_TOKEN
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: OPENCORPORATES_API_KEY
        sync: false
      - key: NUMVERIFY_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      # AI summary engine (optional, cheapest-first). Ollama is local-only so
      # it is not set here; Gemini/Claude keys can be added if wanted.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Payments (Stripe). Subscriptions stay off until these are set. Create
      # two recurring prices in Stripe and paste their price IDs here.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_DEEP
        sync: false
      # Absolute base URL of the deployed app — used for Stripe redirect URLs.
      - key: APP_BASE_URL
        value: https://hhinvestigations.com

  # Scheduled monitoring: re-runs saved monitors and emails on change.
  - type: cron
    name: hh-monitor
    runtime: python
    schedule: "0 * * * *"  # hourly
    buildCommand: pip install -r requirements-prod.txt
    startCommand: python monitor.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hh-intake-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: COURTLISTENER_TOKEN
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: OPENCORPORATES_API_KEY
        sync: false
      - key: NUMVERIFY_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: hh-intake-db
    plan: starter
