<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Henry &amp; Henry — Brand Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1A2238; --gold:#8B6914; --paper:#FAF8F2; --rule:#D3D1C7; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Iowan Old Style','Times New Roman',serif;line-height:1.55}
  header{padding:48px 24px 24px;text-align:center;border-bottom:0.5px solid var(--rule)}
  header img{max-width:680px;width:100%;height:auto}
  main{max-width:920px;margin:0 auto;padding:32px 24px 80px}
  section{padding:24px 0;border-bottom:0.5px solid var(--rule)}
  h2{font-family:'Cinzel',Georgia,serif;letter-spacing:4px;font-size:14px;color:var(--gold);margin:0 0 16px;text-transform:uppercase}
  iframe{width:100%;border:0.5px solid var(--rule);background:#fff;border-radius:4px}
  .swatch{display:inline-block;width:120px;height:80px;margin:6px;border-radius:4px;border:0.5px solid var(--rule);position:relative}
  .swatch span{position:absolute;bottom:6px;left:8px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);letter-spacing:1px}
  footer{padding:24px;text-align:center;font-size:11px;letter-spacing:4px;color:#888}
</style>
</head>
<body>
<header>
  <img src="primary_wordmark.svg" alt="Henry &amp; Henry — Investigative Intelligence">
</header>
<main>
  <section>
    <h2>Wordmark Concepts</h2>
    <iframe src="wordmark_concepts.svg" height="900" loading="lazy" title="Wordmark concepts"></iframe>
  </section>
  <section>
    <h2>Wordmark v2 (HTML)</h2>
    <iframe src="wordmark_v2.html" height="900" loading="lazy" title="Wordmark v2"></iframe>
  </section>
  <section>
    <h2>Palette</h2>
    <div class="swatch" style="background:#1A2238"><span>INK · #1A2238</span></div>
    <div class="swatch" style="background:#8B6914"><span>GOLD · #8B6914</span></div>
    <div class="swatch" style="background:#FAF8F2;border-color:#bbb"><span style="color:#444;text-shadow:none">PAPER · #FAF8F2</span></div>
    <div class="swatch" style="background:#D3D1C7"><span style="color:#222;text-shadow:none">RULE · #D3D1C7</span></div>
  </section>
</main>
<footer>DEFENSIBLE &nbsp;·&nbsp; AUDIT-READY &nbsp;·&nbsp; DISCREET</footer>
</body>
</html>
